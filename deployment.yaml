apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-hello
  labels:
    app: nginx-hello

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-hello

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: nginx-hello

    spec:
      shareProcessNamespace: true

      initContainers:
        - name: init-done
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo done"]

      containers:
        - name: nginx
          image: nginx:alpine

          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /usr/share/nginx/html
              printf 'hello in MLOPS MENA COMMUNITY : %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3

        - name: time-updater
          image: nginx:alpine

          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                NGINX_PID=""
                for proc in /proc/[0-9]*; do
                  PID="${proc##*/}"
                  [ "$PID" = "$$" ] && continue
                  [ -r "$proc/cmdline" ] || continue
                  CMDLINE="$(tr '\000' ' ' < "$proc/cmdline" 2>/dev/null || true)"
                  case "$CMDLINE" in
                    *"nginx: master process"*)
                      NGINX_PID="$PID"
                      break
                      ;;
                  esac
                done

                if [ -n "$NGINX_PID" ] && [ -d "/proc/$NGINX_PID/root/usr/share/nginx/html" ]; then
                  printf 'hello in MLOPS MENA COMMUNITY : %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" > "/proc/$NGINX_PID/root/usr/share/nginx/html/index.html"
                fi

                sleep 5
              done
